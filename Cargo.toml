[package]
name = "lazyodoo"
version = "0.1.0"
edition = "2024"
description = "TUI para gestionar tareas y horas de Odoo por JSON-RPC"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
crossterm = "0.29"
dirs = "7.0.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.0"

[dev-dependencies]
mockito = "1.7.2"
tempfile = "3.27.0"
